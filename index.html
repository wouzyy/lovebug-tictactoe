<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lovebug Tic-Tac-Toe ♡</title>
<style>
:root{--pink:#ff8fbd;--deep:#9e3268;--cream:#fff8fb;--ink:#592943}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#ffe1ef,transparent 32%),radial-gradient(circle at 90% 85%,#e8ddff,transparent 35%),#fff5fa;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}.game{width:min(100%,430px);background:#ffffffd9;border:2px solid #ffd0e3;border-radius:28px;padding:25px;box-shadow:0 18px 55px #b94e8220;text-align:center}h1{margin:0;font-size:clamp(27px,7vw,36px);color:var(--deep)}.subtitle{margin:7px 0 20px;color:#a86688}.score{display:flex;justify-content:space-around;gap:10px;margin-bottom:17px}.score div{background:#fff0f7;border:1px solid #ffd2e5;border-radius:15px;padding:10px;flex:1}.score strong{display:block;font-size:23px}.status{font-weight:700;min-height:28px;margin:15px 0}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cell{aspect-ratio:1;border:0;border-radius:18px;background:#fff0f7;box-shadow:inset 0 0 0 2px #ffd0e3;color:var(--deep);font-size:clamp(38px,12vw,58px);font-weight:800;cursor:pointer;transition:transform .12s,background .12s}.cell:hover:enabled{transform:translateY(-2px);background:#ffe2ef}.cell:focus-visible,button:focus-visible{outline:3px solid #a85bff;outline-offset:3px}.cell:disabled{cursor:default}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:12px 10px;border:0;border-radius:14px;background:#f8c3dc;color:#77264f;font-weight:800;font-size:14px;cursor:pointer}.actions button.primary{background:var(--pink);color:#fff}.foot{font-size:12px;color:#b27b99;margin:18px 0 0}.win{background:#ffe0ed!important;box-shadow:inset 0 0 0 3px #ff8fbd}
</style>
</head>
<body><main class="game"><h1>Lovebug Tic-Tac-Toe ♡</h1><p class="subtitle">a tiny game for two lovebugs</p><section class="score" aria-label="Score"><div>🌸 Player X<strong id="scoreX">0</strong></div><div>🦋 Draws<strong id="scoreD">0</strong></div><div>💗 Player O<strong id="scoreO">0</strong></div></section><div class="status" id="status" aria-live="polite">Player X's turn ✨</div><div class="board" id="board" role="group" aria-label="Tic tac toe board"></div><div class="actions"><button class="primary" id="again">Play again ↻</button><button id="reset">Reset scores ♡</button></div><p class="foot">made with love, just for fun ✿</p></main>
<script>
const boardEl=document.getElementById('board'),statusEl=document.getElementById('status');let cells=Array(9).fill(''),turn='X',done=false,scores={X:0,O:0,D:0};const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let buttons=[];
function render(){boardEl.innerHTML='';buttons=[];cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.type='button';b.setAttribute('aria-label',`Cell ${i+1}${v?', '+v:''}`);b.textContent=v?(v==='X'?'♡':'✿'):'';b.disabled=!!v||done;b.addEventListener('click',()=>play(i));boardEl.appendChild(b);buttons.push(b)});document.getElementById('scoreX').textContent=scores.X;document.getElementById('scoreO').textContent=scores.O;document.getElementById('scoreD').textContent=scores.D}
function play(i){if(done||cells[i])return;cells[i]=turn;const line=wins.find(w=>w.every(n=>cells[n]===turn));if(line){done=true;scores[turn]++;statusEl.textContent=`Player ${turn} wins! 💖`;line.forEach(n=>buttons[n]?.classList.add('win'));}else if(cells.every(Boolean)){done=true;scores.D++;statusEl.textContent="It's a draw! Sending hugs ♡";}else{turn=turn==='X'?'O':'X';statusEl.textContent=`Player ${turn}'s turn ✨`;}render();if(line)line.forEach(n=>buttons[n].classList.add('win'));}
function next(){cells=Array(9).fill('');turn='X';done=false;statusEl.textContent="Player X's turn ✨";render()}
document.getElementById('again').addEventListener('click',next);document.getElementById('reset').addEventListener('click',()=>{scores={X:0,O:0,D:0};next()});render();
</script></body></html>
